name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [design/refonte-studio, main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_PAYMENT_API_URL: ${{ secrets.VITE_PAYMENT_API_URL }}
          VITE_COACH_API_URL: ${{ secrets.VITE_COACH_API_URL }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Compiler l'APK (debug, installable directement)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dek-fitness-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
